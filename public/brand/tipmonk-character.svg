  <path d="M234 462 C230 474 232 484 226 496 M244 462 C246 474 246 484 252 494" fill="none" stroke="#3B2618" stroke-width="12" stroke-linecap="round"/>
  <path d="M234 462 C230 474 232 484 226 496 M244 462 C246 474 246 484 252 494" fill="none" stroke="#F8E7C9" stroke-width="5" stroke-linecap="round"/>
  <circle cx="239" cy="460" r="10" fill="#F8E7C9" stroke="#3B2618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- paws holding it -->
  <ellipse cx="180" cy="422" rx="17" ry="15" fill="#C8782F" stroke="#3B2618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="332" cy="422" rx="17" ry="15" fill="#C8782F" stroke="#3B2618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
