  <path d="M222 292 L256 352 L290 292 Z" fill="#F8E7C9" stroke="#3B2618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  
  <g id="head">
    <!-- hood -->
    <circle cx="256" cy="188" r="148" fill="#2457C5" stroke="#3B2618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M150 110 C175 75 215 58 256 58 C297 58 337 75 362 110" fill="none" stroke="#3C70DC" stroke-width="10" stroke-linecap="round" opacity=".55"/>
    <!-- ear holes in the hood, then ears poking through -->
    <ellipse cx="170" cy="76" rx="33" ry="30" fill="#15306A"/>
    <ellipse cx="342" cy="76" rx="33" ry="30" fill="#15306A"/>
    <circle cx="170" cy="70" r="27" fill="#C8782F" stroke="#3B2618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="342" cy="70" r="27" fill="#C8782F" stroke="#3B2618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="170" cy="72" r="13" fill="#F19A86"/>
    <circle cx="342" cy="72" r="13" fill="#F19A86"/>
    <!-- hood opening -->
    <ellipse cx="256" cy="204" rx="131" ry="121" fill="none" stroke="#3C70DC" stroke-width="9" opacity=".8"/>
    <ellipse cx="256" cy="204" rx="124" ry="114" fill="#15306A"/>
    <!-- face -->
    <ellipse cx="256" cy="212" rx="110" ry="100" fill="#C8782F" stroke="#3B2618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
