    <path d="M228 118 Q256 110 284 118 L270 176 Q256 186 242 176 Z" fill="#F8E7C9" opacity=".9"/>
    <path d="M247 114 Q256 111 265 114 L261 172 Q256 178 251 172 Z" fill="#3B2618"/>
    <!-- eye stripes: cream brow band above, dark band through the eye -->
    <path d="M238 182 C214 166 186 160 156 168 C160 158 182 146 212 150 C228 153 240 166 238 182 Z" fill="#F8E7C9"/>
    <path d="M274 182 C298 166 326 160 356 168 C352 158 330 146 300 150 C284 153 272 166 274 182 Z" fill="#F8E7C9"/>
    <path d="M236 200 C212 186 180 180 150 190 C152 200 176 212 236 214 Z" fill="#A45F22" opacity=".7"/>
    <path d="M276 200 C300 186 332 180 362 190 C360 200 336 212 276 214 Z" fill="#A45F22" opacity=".7"/>
    <!-- stuffed cheeks (chipmunk!) -->
    <circle cx="186" cy="252" r="44" fill="#F8E7C9" stroke="#3B2618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="326" cy="252" r="44" fill="#F8E7C9" stroke="#3B2618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <ellipse cx="256" cy="256" rx="54" ry="40" fill="#F8E7C9"/>
    <ellipse cx="178" cy="262" rx="19" ry="11" fill="#F19A86" opacity=".85"/>
    <ellipse cx="334" cy="262" rx="19" ry="11" fill="#F19A86" opacity=".85"/>
    <!-- eyes -->
    <ellipse cx="216" cy="204" rx="16" ry="20" fill="#1D1612"/>
    <ellipse cx="296" cy="204" rx="16" ry="20" fill="#1D1612"/>
    <circle cx="222" cy="196" r="6.5" fill="#fff"/>
    <circle cx="302" cy="196" r="6.5" fill="#fff"/>
    <circle cx="211" cy="213" r="3" fill="#fff" opacity=".85"/>
    <circle cx="291" cy="213" r="3" fill="#fff" opacity=".85"/>
    <!-- nose, smile, little buck teeth -->
    <path d="M245 236 Q256 229 267 236 Q263 248 256 250 Q249 248 245 236 Z" fill="#3B2618"/>
    <path d="M240 258 Q248 268 256 258 Q264 268 272 258" fill="none" stroke="#3B2618" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M250 262 L250 271 Q256 274 262 271 L262 262" fill="#fff" stroke="#3B2618" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M256 263 L256 272" stroke="#3B2618" stroke-width="2.5"/>
  </g>
  <!-- acorn prayer beads -->
  <circle cx="204.3" cy="312.5" r="7" fill="#7A4B27" stroke="#3B2618" stroke-width="3"/>
    <circle cx="214.7" cy="322.8" r="7" fill="#7A4B27" stroke="#3B2618" stroke-width="3"/>
    <circle cx="225.0" cy="330.8" r="7" fill="#7A4B27" stroke="#3B2618" stroke-width="3"/>
    <circle cx="235.3" cy="336.4" r="7" fill="#7A4B27" stroke="#3B2618" stroke-width="3"/>
    <circle cx="245.7" cy="339.9" r="7" fill="#7A4B27" stroke="#3B2618" stroke-width="3"/>
    <circle cx="266.3" cy="339.9" r="7" fill="#7A4B27" stroke="#3B2618" stroke-width="3"/>
    <circle cx="276.7" cy="336.4" r="7" fill="#7A4B27" stroke="#3B2618" stroke-width="3"/>
    <circle cx="287.0" cy="330.8" r="7" fill="#7A4B27" stroke="#3B2618" stroke-width="3"/>
    <circle cx="297.3" cy="322.8" r="7" fill="#7A4B27" stroke="#3B2618" stroke-width="3"/>
    <circle cx="307.7" cy="312.5" r="7" fill="#7A4B27" stroke="#3B2618" stroke-width="3"/>
    <path d="M256 334 L256 344" stroke="#3B2618" stroke-width="3"/>
    <ellipse cx="256" cy="366" rx="13" ry="15" fill="#B97534" stroke="#3B2618" stroke-width="3.5"/>
    <path d="M240 356 Q240 342 256 342 Q272 342 272 356 Z" fill="#5A3A22" stroke="#3B2618" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M256 342 Q258 336 263 335" fill="none" stroke="#3B2618" stroke-width="3" stroke-linecap="round"/>
    <circle cx="251" cy="364" r="3" fill="#fff" opacity=".5"/>
  <!-- sleeves -->
  <path d="M170 312 C140 352 140 404 172 430 L206 410 C190 384 192 350 206 326 Z" fill="#2457C5" stroke="#3B2618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M342 312 C372 352 372 404 340 430 L306 410 C322 384 320 350 306 326 Z" fill="#2457C5" stroke="#3B2618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- scroll of tips -->
  <rect x="188" y="390" width="136" height="58" rx="4" fill="#FFF8EA" stroke="#3B2618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M200 406 l6 6 l11 -12 M200 421 l6 6 l11 -12 M200 436 l6 6 l11 -12" fill="none" stroke="#1F7A47" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M226 407 H306 M226 422 H296 M226 437 H302" stroke="#C7AE87" stroke-width="4.5" stroke-linecap="round"/>
  <rect x="172" y="382" width="22" height="74" rx="11" fill="#E9CFA4" stroke="#3B2618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="318" y="382" width="22" height="74" rx="11" fill="#E9CFA4" stroke="#3B2618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
