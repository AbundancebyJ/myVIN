<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Tip, the tipmonk chipmunk monk</title>
  <!-- tail (behind everything): upright, curling at the tip -->
  <path d="M330 452 C420 452 456 384 446 304 C438 244 444 196 476 176" fill="none" stroke="#3B2618" stroke-width="66" stroke-linecap="round"/>
  <path d="M330 452 C420 452 456 384 446 304 C438 244 444 196 476 176" fill="none" stroke="#C8782F" stroke-width="54" stroke-linecap="round"/>
  <path d="M352 444 C418 440 440 380 432 312 C426 262 430 220 452 198" fill="none" stroke="#3B2618" stroke-width="10" stroke-linecap="round"/>
  <!-- feet -->
  <ellipse cx="210" cy="482" rx="32" ry="17" fill="#C8782F" stroke="#3B2618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="302" cy="482" rx="32" ry="17" fill="#C8782F" stroke="#3B2618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- robe -->
  <path d="M168 290 C146 360 126 430 138 474 Q256 498 374 474 C386 430 366 360 344 290 Z" fill="#2457C5" stroke="#3B2618" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M200 468 C204 440 204 420 198 400 M312 468 C308 440 308 420 314 400" fill="none" stroke="#1B4297" stroke-width="6" stroke-linecap="round"/>
