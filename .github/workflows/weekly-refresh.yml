# Rebuilds the site weekly so the static /recalls pages pick up new NHTSA recalls,
# complaints and ratings. Cloudflare Pages runs `npm run build:full`, which refetches
# the data before building.
#
# Setup (once):
#   1. Cloudflare dashboard > Workers & Pages > vin-safety-report > Settings > Builds >
#      Deploy hooks > Add deploy hook (branch: main). Copy the URL.
#   2. GitHub repo > Settings > Secrets and variables > Actions > New repository secret:
#      name CF_DEPLOY_HOOK, value = that URL.
# Run it by hand any time from the Actions tab ("Run workflow").
name: Weekly data refresh

on:
  schedule:
    - cron: "23 9 * * 1" # Mondays 09:23 UTC
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Cloudflare Pages deploy
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret CF_DEPLOY_HOOK is not set. See the setup steps at the top of this workflow file."
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 10 -X POST "$HOOK" -o /dev/null
          echo "Deploy triggered."
